  <g stroke="#FAF5F0" stroke-opacity="0.35" stroke-width="6" stroke-dasharray="14 12">
    <line x1="205" y1="113" x2="205" y2="399"/>
    <line x1="307" y1="113" x2="307" y2="399"/>
    <line x1="113" y1="205" x2="399" y2="205"/>
    <line x1="113" y1="307" x2="399" y2="307"/>
  </g>
  <!-- A bed against the top wall and a sofa facing it. -->
  <rect x="146" y="122" width="118" height="150" rx="16" fill="#FAF5F0"/>
  <rect x="158" y="134" width="94" height="28" rx="10" fill="#E3B89F"/>
  <rect x="290" y="318" width="98" height="64" rx="14" fill="#FAF5F0"/>
